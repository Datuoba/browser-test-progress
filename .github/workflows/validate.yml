name: Validate marketplace

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/browser-test-progress

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/browser-test-progress/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: node ../../scripts/validate-marketplace.mjs
      - run: git diff --exit-code -- dist/server.mjs
